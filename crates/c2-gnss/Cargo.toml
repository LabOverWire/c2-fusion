[package]
name = "c2-gnss"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
thiserror.workspace = true
tokio = { version = "1.53.2", features = ["io-util"] }
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.19", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpio-cdev = { version = "0.6.0", features = ["async-tokio"] }
libc = "0.2"
nix = { version = "0.31.3", default-features = false, features = ["time"] }
