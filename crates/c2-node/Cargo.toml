[package]
name = "c2-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "c2-node"
path = "src/main.rs"

[dependencies]
c2-codec = { path = "../c2-codec" }
c2-exchange = { path = "../c2-exchange" }
stitch-p2p = { git = "https://github.com/LabOverWire/stitch-rs", package = "stitch-p2p", default-features = false, features = ["store", "discovery", "persistence"] }
mqp2p = { git = "https://github.com/LabOverWire/stitch-rs", package = "mqp2p" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync", "net"] }
c2-lora = { version = "0.1.0", path = "../c2-lora" }
c2-model = { version = "0.1.0", path = "../c2-model" }
tokio-serial = "5.5.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
tracing = "0.1.44"
sha2 = "0.11"
humantime = "2.4"
serde_json.workspace = true
opentelemetry = { version = "0.33.1", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }

[target.'cfg(target_os = "linux")'.dependencies]
c2-gnss = { version = "0.1.0", path = "../c2-gnss" }
