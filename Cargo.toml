[workspace]
resolver = "2"
members = ["crates/c2-model", "crates/c2-codec"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LabOverWire/c2-fusion"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
