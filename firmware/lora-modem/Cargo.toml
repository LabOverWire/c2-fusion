[package]
edition      = "2024"
name         = "lora-modem"
rust-version = "1.95"
version      = "0.1.0"
license      = "Apache-2.0"

[workspace]

[[bin]]
name = "lora-modem"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32c3", "log-04"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
